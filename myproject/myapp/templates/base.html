<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Shop{% endblock %}</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #89f7fe, #66a6ff);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
      animation: fadeIn 1s ease-in;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 35px 40px;
      width: 370px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.8s ease;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 22px;
      color: #2d2d2d;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #66a6ff;
      box-shadow: 0 0 6px #66a6ff;
    }

    button {
      background: linear-gradient(90deg, #66a6ff, #89f7fe);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #66a6ff;
    }

    a {
      color: #3f2b96;
      text-decoration: none;
      transition: 0.3s;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .error {
      color: #d8000c;
      background: #ffbaba;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    img {
      width: 100px;
      border-radius: 10px;
      margin-bottom: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes slideUp {
      from {transform: translateY(30px); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }
  </style>
</head>
<body>
  <div class="container">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
