{% extends "base.html" %}
{% block title %}Sign Up — SonicWave{% endblock %}
{% block content %}

<h2>Create Account</h2>
<p class="subtitle">Join SonicWave today</p>

{% if error %}
<div class="alert-error">
  {% for key, value in error.items %}
  <p style="margin:2px 0"><i class="bi bi-exclamation-circle me-1"></i>{{ value }}</p>
  {% endfor %}
</div>
{% endif %}

<form method="POST">
  {% csrf_token %}
  <div class="form-group">
    <label>Username</label>
    <input type="text" name="name" placeholder="Your name" required>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" placeholder="you@example.com" required>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" name="password" placeholder="••••••••" required>
  </div>
  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" name="confirm_password" placeholder="••••••••" required>
  </div>
  <div class="form-group">
    <label>Phone</label>
    <input type="text" name="phone" placeholder="10-digit number" maxlength="10" minlength="10" required>
  </div>
  <button type="submit" class="btn-primary-gold">Create Account</button>
</form>

<div class="auth-footer">
  Already have an account? <a href="{% url 'login' %}">Sign in</a>
</div>

{% endblock %}
