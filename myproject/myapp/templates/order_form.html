<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — SonicWave</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c; --gold-light: #e8c96d;
      --navy: #0a0f1e; --navy-mid: #111827; --navy-light: #1a2340;
      --glass-border: rgba(255,255,255,0.08);
      --text-primary: #f0f0f0; --text-muted: #8a95a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .sw-nav {
      position: sticky; top: 0; z-index: 200;
      background: rgba(10,15,30,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 0 40px;
      display: flex; align-items: center; justify-content: space-between;
      height: 68px; position: relative;
    }

    .sw-nav::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.5;
    }

    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 22px; color: var(--gold); letter-spacing: 2px;
      text-decoration: none; display: flex; align-items: center; gap: 10px;
    }

    .nav-brand .icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--navy);
    }

    .nav-links { display: flex; align-items: center; gap: 10px; }

    .nav-btn {
      padding: 8px 18px; border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      text-decoration: none; transition: all 0.25s;
      border: 1px solid var(--glass-border);
      color: var(--text-primary); background: rgba(255,255,255,0.04);
    }

    .nav-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* PAGE */
    .page-content {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 60px 20px;
    }

    .checkout-card {
      background: var(--navy-light);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%; max-width: 560px;
      position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      animation: cardIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }

    .checkout-card::before {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .card-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: var(--navy);
      margin: 0 auto 20px;
    }

    .checkout-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px; text-align: center; margin-bottom: 6px;
    }

    .checkout-card .subtitle {
      text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 32px;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 8px;
    }

    .form-group input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px; color: var(--text-primary);
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      transition: all 0.3s; outline: none;
    }

    .form-group input:focus {
      border-color: var(--gold);
      background: rgba(201,168,76,0.05);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }

    .form-group input::placeholder { color: #2c3748; }

    .btn-submit {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--navy); font-family: 'DM Sans', sans-serif;
      font-weight: 700; font-size: 16px; border: none;
      border-radius: 12px; cursor: pointer;
      transition: all 0.3s; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.4); }

    footer {
      background: var(--navy-mid); border-top: 1px solid var(--glass-border);
      padding: 24px 40px; text-align: center;
      color: var(--text-muted); font-size: 14px;
    }

    footer a { color: var(--gold); text-decoration: none; margin: 0 8px; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 600px) {
      .checkout-card { padding: 36px 24px; }
      .form-row { grid-template-columns: 1fr; }
      .sw-nav { padding: 0 20px; }
    }
  </style>
</head>
<body>

  <nav class="sw-nav" style="position:sticky;top:0;z-index:200;">
    <a href="/" class="nav-brand"><span class="icon">🎧</span>SonicWave</a>
    <div class="nav-links">
      <a href="{% url 'home' %}" class="nav-btn"><i class="bi bi-house me-1"></i>Home</a>
      <a href="{% url 'orders_page' %}" class="nav-btn"><i class="bi bi-bag me-1"></i>My Orders</a>
      <a href="{% url 'cart_item' %}" class="nav-btn"><i class="bi bi-cart3 me-1"></i>Cart</a>
    </div>
  </nav>

  <div class="page-content">
    <div class="checkout-card">
      <div class="card-icon">📦</div>
      <h2>Complete Your Order</h2>
      <p class="subtitle">Fill in your delivery details below</p>

      <form method="POST" action="{% url 'order_form' %}">
        {% csrf_token %}

        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="John Doe" required maxlength="50">
          </div>
          <div class="form-group">
            <label>Contact No</label>
            <input type="text" name="contact_no" placeholder="10-digit number" minlength="10" maxlength="10" required>
          </div>
        </div>

        <div class="form-group">
          <label>Alternate No <span style="color:#3a4558;font-weight:400">(Optional)</span></label>
          <input type="text" name="alternate_no" placeholder="Alternate phone number" minlength="10" maxlength="10">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Plot / Door No</label>
            <input type="number" name="plot_no" placeholder="Plot no." required>
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="number" name="pincode" placeholder="6-digit pincode" required>
          </div>
        </div>

        <div class="form-group">
          <label>Street Address</label>
          <input type="text" name="streetaddress" placeholder="Street, Area, Landmark" required>
        </div>

        <div class="form-group">
          <label>City</label>
          <input type="text" name="city" placeholder="Your city" required>
        </div>

        <button type="submit" class="btn-submit">
          <i class="bi bi-bag-check"></i> Place Order
        </button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 SonicWave. All Rights Reserved.</p>
    <p style="margin-top:8px;"><a href="#">About</a><a href="#">Privacy Policy</a><a href="#">Terms</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
